name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Prepare the site folder
        env:
          QUESTION_ENDPOINT: ${{ vars.QUESTION_ENDPOINT }}
        run: |
          # publish every page and lesson folder, but not repo-only files
          mkdir -p _site
          for f in * .[!.]*; do
            [ -e "$f" ] || continue
            case "$f" in
              .git|.github|_site|apps-script|README.md) continue ;;
            esac
            cp -r "$f" _site/
          done
          # put the Apps Script web app URL into the question form on every page
          if [ -n "$QUESTION_ENDPOINT" ]; then
            find _site -name '*.html' -exec sed -i "s|PASTE_YOUR_WEB_APP_URL_HERE|${QUESTION_ENDPOINT}|g" {} +
            echo "Question form endpoint set."
          else
            echo "::warning::Repository variable QUESTION_ENDPOINT is not set, so question forms will say they are not ready."
          fi
          echo "Published files:"; find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
